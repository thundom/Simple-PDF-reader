name: Windows build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: python -m PyInstaller --noconfirm --windowed --name "Simple PDF reader" --collect-all pypdfium2 --collect-all reportlab --collect-all keyring --collect-all jaraco app.py
      - name: Include docs and dependency license metadata
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md, CLOUD_SETUP.md, THIRD_PARTY_NOTICES.md 'dist/Simple PDF reader/'
          python collect_licenses.py
      - name: Compile installer
        shell: pwsh
        run: '& "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Simple-PDF-reader-Windows
          path: dist/
